{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>{{ title }}</h1>
        <p>Fill in the details and submit the form.</p>
    </div>

    <div class="section">
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div class="field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="button">Save</button>
            <a href="{% url cancel_url %}" class="button secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
