{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>Login</h1>
        <p>Sign in to manage FitZone.</p>
    </div>

    <div class="section">
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div class="field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="button">Login</button>
            <a href="{% url 'register' %}" class="button secondary">Register</a>
        </form>
    </div>
</div>
{% endblock %}
