{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>{{ title }}</h1>
        <p>Please confirm this action.</p>
    </div>

    <div class="section">
        <p>Are you sure you want to delete <strong>{{ object_name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="button danger">Delete</button>
            <a href="{% url cancel_url %}" class="button secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
